
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Oceânica de Pessoas</title>
    <style>
        :root {
            --ocean-dark: #030712;
            --ocean-deep: #0a192f;
            --ocean-blue: #0284c7;
            --ocean-light: #e0f2fe;
            --ocean-foam: #f0f9ff;
            --accent-cyan: #38bdf8;
            --accent-coral: #fb7185;
            --text-main: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #030712 0%, #0c4a6e 50%, #0284c7 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Efeito de Bolhas Subindo no Fundo */
        .bubbles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        .bubble:nth-child(1) { width: 20px; height: 20px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 35px; height: 35px; left: 30%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 15px; height: 15px; left: 50%; animation-duration: 7s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 25px; height: 25px; left: 70%; animation-duration: 10s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 40px; height: 40px; left: 85%; animation-duration: 15s; animation-delay: 3s; }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 3px 6px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            margin-bottom: 35px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            position: relative;
        }

        .form-card::before {
            content: "🌊";
            position: absolute;
            top: -15px;
            right: 25px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #bae6fd;
            border-radius: 10px;
            box-sizing: border-box;
            background-color: #f8fafc;
            transition: all 0.3s;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--ocean-blue);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.25);
            background-color: #fff;
        }

        button.submit-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
            letter-spacing: 0.5px;
        }

        button.submit-btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.6);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
            text-align: center;
            border-top: 5px solid var(--accent-cyan);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid var(--accent-cyan);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card h3 {
            margin: 5px 0 15px 0;
            font-size: 1.25rem;
            color: #0f172a;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .like-btn {
            background: var(--ocean-foam);
            border: 2px solid #bae6fd;
            color: #0369a1;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .like-btn:hover {
            background: #e0f2fe;
            border-color: var(--ocean-blue);
            transform: scale(1.05);
        }

        .like-btn.liked {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-color: #0369a1;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
        }

        .delete-btn {
            background: #fff1f2;
            border: 2px solid #fecdd3;
            color: #e11d48;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #ffe4e6;
            border-color: #fb7185;
            transform: scale(1.05);
        }

        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            color: #bae6fd;
            font-style: italic;
            font-size: 1.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 15px;
            border: 1px dashed rgba(186, 230, 253, 0.4);
        }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <h1>🐋 Galeria do Mar Profundo 🌊</h1>

        <div class="form-card">
            <form id="pessoaForm">
                <div class="form-group">
                    <label for="nome">🏴‍☠️ Nome do Marinheiro(a):</label>
                    <input type="text" id="nome" required placeholder="Ex: Capitão Silva dos Sete Mares">
                </div>
                <div class="form-group">
                    <label for="foto">📸 Retrato Oficial:</label>
                    <input type="file" id="foto" accept="image/*" required>
                </div>
                <button type="submit" class="submit-btn">⚓ Adicionar à Frota</button>
            </form>
        </div>

        <div class="grid" id="gridPessoas">
            <!-- Renderizado via Fetch -->
        </div>
    </div>

    <script>
        const API_URL = '/api/pessoas'; // Altere para a URL real do seu backend
        const gridPessoas = document.getElementById('gridPessoas');
        const form = document.getElementById('pessoaForm');

        // Buscar dados do servidor (GET)
        async function carregarPessoas() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro ao buscar dados da frota');
                const pessoas = await response.json();
                renderizarPessoas(pessoas);
            } catch (error) {
                console.error(error);
                gridPessoas.innerHTML = '<p class="empty-message">⚠️ Erro ao conectar com as profundezas do servidor.</p>';
            }
        }

        function renderizarPessoas(pessoas) {
            gridPessoas.innerHTML = '';

            if (!pessoas || pessoas.length === 0) {
                gridPessoas.innerHTML = '<p class="empty-message">🐙 O oceano está calmo... Nenhum marinheiro por aqui ainda. Seja o primeiro a navegar!</p>';
                return;
            }

            pessoas.forEach((pessoa) => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <img src="${pessoa.foto}" alt="${pessoa.nome}">
                    <h3>${pessoa.nome}</h3>
                    <div class="card-actions">
                        <button class="like-btn ${pessoa.curtido ? 'liked' : ''}" onclick="toggleCurtida('${pessoa.id}', ${pessoa.curtido}, ${pessoa.curtidas})">
                            ⚓ <span>${pessoa.curtidas}</span>
                        </button>
                        <button class="delete-btn" onclick="deletarPessoa('${pessoa.id}')" title="Afundar card">
                            🗑️
                        </button>
                    </div>
                `;

                gridPessoas.appendChild(card);
            });
        }

        // Enviar novo cadastro via Fetch (POST com FormData)
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const fotoInput = document.getElementById('foto');
            const file = fotoInput.files[0];

            if (!file) return;

            const formData = new FormData();
            formData.append('nome', nome);
            formData.append('foto', file);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData // O navegador define automaticamente o Content-Type como multipart/form-data
                });

                if (!response.ok) throw new Error('Erro ao adicionar marinheiro');

                form.reset();
                carregarPessoas(); // Recarrega a lista do servidor
            } catch (error) {
                console.error(error);
                alert('Não foi possível adicionar o marinheiro à frota.');
            }
        });

        // Alternar curtida via Fetch (PATCH ou PUT)
        async function toggleCurtida(id, curtidoAtual, curtidasAtuais) {
            const novoEstado = !curtidoAtual;
            const novasCurtidas = novoEstado ? curtidasAtuais + 1 : curtidasAtuais - 1;

            try {
                const response = await fetch(`${API_URL}/${id}/curtir`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ curtido: novoEstado, curtidas: novasCurtidas })
                });

                if (!response.ok) throw new Error('Erro ao atualizar curtida');
                carregarPessoas();
            } catch (error) {
                console.error(error);
            }
        }

        // Deletar item via Fetch (DELETE)
        async function deletarPessoa(id) {
            if (!confirm('Tem certeza que deseja afundar este marinheiro?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Erro ao excluir marinheiro');
                carregarPessoas();
            } catch (error) {
                console.error(error);
                alert('Não foi possível remover o item.');
            }
        }

        // Inicializar carregamento
        carregarPessoas();
    </script>
</body>
</html>
